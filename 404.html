<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% seo %}
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#eef2fb" />
<!-- GitHub Pages serves this file for any missing path, however deep,
     so every link here is built from the site root, never relative -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=2" sizes="16x16 32x32 48x48" />
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}?v=2" type="image/svg+xml" />
<link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}?v=2" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}?v=2" sizes="180x180" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}" />
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(80% 70% at 20% 10%,#e3e9ff,transparent 60%),
               radial-gradient(70% 60% at 90% 90%,#f1eafd,transparent 60%),var(--air-1)}
  .lost{width:min(460px,100%);text-align:center;padding:34px 28px 28px;border-radius:var(--r-5);
    background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:var(--lift-3);
    animation:lostIn .6s var(--spring) both}
  @keyframes lostIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
  .lost svg{width:180px;height:70px;overflow:visible;margin-bottom:8px}
  .lost .w{fill:none;stroke:rgba(40,54,92,.22);stroke-width:1.6;stroke-dasharray:4 6}
  .lost .cut{stroke:var(--alert);stroke-dasharray:3 5;animation:cut 1.4s linear infinite}
  @keyframes cut{to{stroke-dashoffset:-32}}
  .lost .n{fill:#fff;stroke:rgba(40,54,92,.2);stroke-width:1.4}
  .lost .hub{fill:var(--hub)}
  .lost .pk{fill:var(--packet);animation:pk 2.2s var(--io) infinite}
  @keyframes pk{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{transform:translateX(70px);opacity:1}85%,100%{transform:translateX(78px);opacity:0}}
  .code{font:600 12px "JetBrains Mono",monospace;color:var(--alert);letter-spacing:.06em}
  h1{font:600 24px "Space Grotesk",sans-serif;letter-spacing:-.03em;margin:6px 0 8px;color:var(--ink-1)}
  p{margin:0 auto 22px;max-width:34ch;color:var(--ink-2);font-size:14px;line-height:1.6}
  a.go{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r-3);
    background:linear-gradient(180deg,#252d3b,#151a23);color:#fff;text-decoration:none;font-size:13px;font-weight:500;
    box-shadow:0 1px 2px rgba(22,33,64,.28),0 8px 18px -10px rgba(22,33,64,.6);transition:transform .15s var(--out),filter .2s}
  a.go:hover{transform:translateY(-1px);filter:brightness(1.15)}
</style>
</head>
<body>
  <main class="lost">
    <svg viewBox="0 0 180 70" aria-hidden="true">
      <path class="w" d="M20 35 C50 35, 50 35, 90 35"/>
      <path class="w cut" d="M90 35 C120 35, 130 35, 160 35"/>
      <circle class="pk" cx="20" cy="35" r="3.5"/>
      <rect class="n" x="4" y="25" width="32" height="20" rx="6"/>
      <circle class="hub" cx="90" cy="35" r="11"/>
      <rect class="n" x="144" y="25" width="32" height="20" rx="6" style="stroke:var(--alert);stroke-dasharray:3 3"/>
    </svg>
    <div class="code">404 · NO ROUTE TO HOST</div>
    <h1>This page dropped off the mesh</h1>
    <p>The address you followed doesn't lead anywhere. The console itself is still up and running.</p>
    <a class="go" href="{{ '/' | relative_url }}">Back to MeshScope</a>
  </main>
</body>
</html>
